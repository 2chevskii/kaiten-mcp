name: Start release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          jq -er --arg version "${RELEASE_TAG#v}" '
            if .version == $version then
              "package=2chevskii-kaiten-mcp-\(.version).tgz"
            else
              error("Release tag must match package.json version after removing the v prefix")
            end
          ' package.json >> "$GITHUB_OUTPUT"

  lint:
    needs: validate-release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    needs: validate-release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check

  build_docs:
    needs: validate-release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  test:
    needs: validate-release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:types
      - run: npm test

  create-release:
    name: Create draft release
    needs: [validate-release, lint, format, build_docs, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      PACKAGE: ${{ needs.validate-release.outputs.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npm run build
          npm pack
          npm run package:check -- "./$PACKAGE"
      - run: |
          if gh release view "$RELEASE_TAG" > /dev/null; then
            gh release upload "$RELEASE_TAG" "$PACKAGE" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE" \
              --draft --verify-tag --title "Kaiten MCP $RELEASE_TAG" --generate-notes
          fi
