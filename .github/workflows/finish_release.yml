name: Finish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to ${{ matrix.registry }}
    runs-on: ubuntu-26.04
    environment:
      name: ${{ matrix.registry == 'npm' && 'npmjs' || 'github-packages' }}
      url: ${{ matrix.registry == 'npm' && 'https://www.npmjs.com/package/@2chevskii/kaiten-mcp' || 'https://github.com/users/2chevskii/packages/npm/package/kaiten-mcp' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        registry: [npm, github]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: ${{ matrix.registry == 'github' && 'https://npm.pkg.github.com' || '' }}
          scope: '@2chevskii'
          package-manager-cache: false
      - id: version
        run: |
          jq -er --arg version "${RELEASE_TAG#v}" '
            if .version == $version then
              "package=2chevskii-kaiten-mcp-\(.version).tgz"
            else
              error("Release tag must match package.json version after removing the v prefix")
            end
          ' package.json >> "$GITHUB_OUTPUT"
      - env:
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --pattern "$PACKAGE" --dir artifacts
      - name: Stage publication to npm
        if: matrix.registry == 'npm'
        env:
          PACKAGE: ./artifacts/${{ steps.version.outputs.package }}
        run: npm stage publish "$PACKAGE" --registry https://registry.npmjs.org --access public --provenance --tag latest
      - name: Publish to GitHub Packages
        if: matrix.registry == 'github'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PACKAGE: ./artifacts/${{ steps.version.outputs.package }}
        run: npm publish "$PACKAGE" --registry https://npm.pkg.github.com --tag latest
